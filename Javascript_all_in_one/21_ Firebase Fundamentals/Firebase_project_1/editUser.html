<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #f8f9fa, #e0f7ff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    form {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 400px;
    }

    input[type="text"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        transition: border-color 0.3s;
    }

    input[type="text"]:focus {
        border-color: #007bff;
        outline: none;
    }

    input[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
    }

    input[type="submit"]:hover {
        background-color: #0056b3;
        transform: scale(1.02);
    }

    @media (max-width: 480px) {
        form {
            padding: 20px;
        }

        input[type="submit"] {
            font-size: 14px;
        }
    }
</style>

</head>
<body>
    <form action="">
        <input id="name" type="text" placeholder=" Enter new name"/>
        <input type="submit" value="Update Name"/>

    </form>
</body>
</html>
<script>
    let param=new URLSearchParams(window.location.search)
    let userId=param.get("id")
    
document.querySelector("form").addEventListener('submit', editUser);
function editUser(){
    event.preventDefault();
    let updatedName=document.querySelector("#name").value;
    let raw=JSON.stringify({
        name:updatedName,
    });
    fetch(
        `https://realtime-database-ba645-default-rtdb.firebaseio.com/users/${userId}.json`,{
            method: "PATCH",
            body:raw,
        }
    ).then((res)=>res.json())
    .then(()=>{
        alert("User Update Successfully")
        window.location.href="index.html"
    })
}
</script>
