<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  * {
    box-sizing: border-box;
    padding: 0;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: linear-gradient(120deg, #e0f7fa, #fff3e0);
    padding: 20px;
  }

  #countainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: auto;
    padding-top: 20px;
  }

  #countainer div {
    background: linear-gradient(145deg, #ffffff, #f1f1f1);
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    padding: 20px;
    transition: all 0.3s ease-in-out;
    border-left: 5px solid #2196f3;
  }

  #countainer div:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 12px 25px rgba(33, 150, 243, 0.3);
    border-left: 5px solid #ff5722;
    background: linear-gradient(145deg, #fefefe, #f0f8ff);
  }

  #countainer h2 {
    color: #333;
    margin-bottom: 10px;
    font-size: 1.3rem;
  }

  #countainer p {
    color: #666;
    font-size: 1rem;
  }

#delete-btn{
    background-color: red;
    border: none;
    border-radius: 5px;
    padding: 5px 15px 5px 15px;
    color: white;
    font-weight: bold;
    margin-top: 10px;

}

#create-btn{
    background-color: teal;
    border: none;
    border-radius: 5px;
    padding: 5px 15px 5px 15px;
    color: white;
    font-weight: bold;
    margin-top: 10px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

#create-btn>a{
    text-decoration: none;
    color: white;
}

#create-btn:hover{
    background-color: #2196f3;
    color: #fff;
}

#edit-btn{
    background-color: teal;
    border: none;
    border-radius: 5px;
    padding: 5px 15px 5px 15px;
    color: white;
    font-weight: bold;
    margin-top: 10px;
    transition: background-color 0.3s ease, color 0.3s ease;
}

#edit-btn>a{
    text-decoration: none;
    color: white;
}

#edit-btn:hover{
    background-color: #0d3a04;
    color: #fff;
}

  /* Responsive Text */
  @media (max-width: 600px) {
    #countainer div {
      padding: 15px;
    }

    #countainer h2 {
      font-size: 1.1rem;
    }

    #countainer p {
      font-size: 0.9rem;
    }
  }
</style>

</head>
<body>

    <button id="create-btn">  <a href="create.html">Create User</a> </button>
    
    <div id="countainer"> </div>
</body>
<script src="index.js"></script>
</html>
